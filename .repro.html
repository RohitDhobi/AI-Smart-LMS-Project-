<!doctype html><html><head>
<link rel="stylesheet" href="src/styles.css">
<link rel="stylesheet" href="src/hod.css">
<style>body{background:#0f172a;margin:0}</style>
</head><body>
<div class="card" style="width:660px;margin:20px auto">
  <div class="card-header"><h2>Notifications</h2></div>
  <div class="hod-form">
    <div class="hod-form-row"><label>Email Notifications</label><input type="checkbox" class="hod-checkbox" checked></div>
    <div class="hod-form-row"><label>Assignment Reminders</label><input type="checkbox" class="hod-checkbox"></div>
  </div>
</div>
<script>
window.addEventListener('load', () => {
  const cb = document.querySelectorAll('.hod-checkbox')[1].getBoundingClientRect();
  const lbl = document.querySelectorAll('label')[1].getBoundingClientRect();
  document.body.insertAdjacentHTML('beforeend', '<pre id="res">CB '+Math.round(cb.x)+' '+Math.round(cb.y)+' '+Math.round(cb.width)+' '+Math.round(cb.height)+' | LBL '+Math.round(lbl.x)+' '+Math.round(lbl.y)+'</pre>');
});
</script>
</body></html>
